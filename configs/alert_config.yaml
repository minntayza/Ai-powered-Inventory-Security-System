siren:
  enabled: true
  audio_path: "assets/audio/siren.mp3"

telegram:
  enabled: true
  timeout_seconds: 10
  max_attempts: 2
  notify_event_types:
    - authorized_removal
    - suspected_theft

storage:
  database_path: "data/logs/security_events.db"
  snapshot_directory: "data/logs/snapshots"
  retention_days: 30
  incident_video:
    enabled: true
    directory: "data/logs/incidents"
    pre_event_seconds: 10
    post_event_seconds: 10
    jpeg_buffer_quality: 75
