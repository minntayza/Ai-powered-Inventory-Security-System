yolo:
  model_path: "yolov8n.pt"
  # Prefer the NVIDIA GPU. Runtime device resolution safely falls back to CPU
  # when CUDA is unavailable on another machine.
  device: "cuda:0"
  image_size: 640
  confidence_threshold: 0.5
  iou_threshold: 0.45
  tracking: true
  target_classes:
    - person
    - bottle
    - backpack
    - handbag
    - cup
    - chair
    - tv
    - laptop
    - mouse
    - remote
    - keyboard
    - cell phone
    - book
    - clock
    - scissors

# COCO classes that should be visible to the demo are split by security policy.
# Only protected classes participate in the baseline and theft decisions.
inventory_policy:
  protected:
    - bottle
    - backpack
    - handbag
    - cup
    - laptop
    - mouse
    - remote
    - keyboard
    - cell phone
    - book
    - scissors
  contextual:
    - chair
    - tv
    - clock

vlm:
  enabled: true
  model_name: "microsoft/Florence-2-base-ft"
  # Prefer the NVIDIA GPU, with the same runtime CPU fallback as YOLO.
  device: "cuda:0"
  max_new_tokens: 128
  trust_remote_code: true
