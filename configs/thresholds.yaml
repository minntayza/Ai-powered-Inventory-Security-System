yolo:
  model_path: "yolov8n.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  # null enables every class in the loaded model. Person detections are still
  # separated from inventory detections for face recognition and tracking.
  target_classes: null

face_recognition:
  model_name: "VGG-Face"
  detector_backend: "opencv"
  distance_metric: "cosine"
  recognition_threshold: 0.4
  # Disabled for the CPU-only classroom demo. Re-enable after GPU acceleration.
  anti_spoofing: false
  db_path: "assets/known_faces"

person_tracking:
  grace_period_seconds: 3
  min_face_size: 50
  face_interval_frames: 10
  # Keep authorization through a brief head turn, but expire old face evidence
  # quickly enough that a later removal is not authorized from a stale sighting.
  authorization_cache_seconds: 4
  track_expiry_seconds: 5

inventory:
  # Fast live-demo profile: a new count wins after four frames in a full
  # window, then needs one additional matching frame before it is committed.
  # This still rejects isolated YOLO misses without making removals feel stuck.
  window_size: 7
  confirmation_frames: 2
  warmup_frames: 7

association:
  # Must outlive inventory stabilization so the item/person evidence is still
  # available after a removed object has disappeared from the camera.
  lookback_seconds: 10.0
  person_bbox_expansion: 0.15
  minimum_score: 0.35
  ambiguity_margin: 0.10

security:
  # Allow a late face result or quick item return, but do not hold a confirmed
  # unknown-person removal for the previous eight-second delay.
  grace_period_seconds: 3
  alert_cooldown_seconds: 30
  # Optional normalized [x1, y1, x2, y2]. Null treats the full frame as monitored.
  shelf_region: null
